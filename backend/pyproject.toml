[project]
name = "product-decision-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "langchain>=1,<2", "langchain-deepseek>=1,<2",
  "chromadb>=1.5,<2", "langchain-chroma>=1,<2",
  "sqlalchemy[asyncio]>=2,<3", "asyncmy>=0.2,<1", "alembic>=1.13,<2",
  "pydantic-settings>=2,<3", "sentence-transformers>=3,<7",
  "httpx>=0.27,<1", "beautifulsoup4>=4,<5",
  "python-ulid>=3,<4", "pyjwt>=2,<3", "pwdlib[argon2]>=0.2,<1", "email-validator>=2,<3",
  "python-dotenv>=1,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2", "aiosqlite>=0.20,<1", "playwright>=1.45,<2"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
